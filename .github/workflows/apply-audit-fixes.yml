name: Apply TravelRef audit fixes

on:
  push:
    paths:
      - "tools/apply_audit_fixes_v3.py"
      - ".github/workflows/apply-audit-fixes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate patcher
        run: python3 -m py_compile tools/apply_audit_fixes_v3.py

      - name: Apply audited source fixes
        run: python3 tools/apply_audit_fixes_v3.py

      - name: Validate generator
        run: python3 -m py_compile tools/generate_official_fr.py

      - name: Regenerate official French mappings
        run: python3 tools/generate_official_fr.py

      - name: Static safety checks
        run: |
          git diff --check
          ! grep -F 'print(str.."(ST): "..d.n..l)' Dusk/TravelRef/TR_Main.lua
          ! grep -F "V.s = skill.nm..' '..rtn" Dusk/TravelRef/TR_Window.lua
          ! grep -F 'loc.a = TR_AreaFR' Dusk/TravelRef/TR_OfficialFR.lua
          ! grep -F 'Areas = NewAreas' Dusk/TravelRef/TR_OfficialFR.lua
          ! grep -F '[fp]' Dusk/TravelRef/TR_OfficialFR_Auto.lua
          grep -F 'Matched location/destination names: 426' tools/TR_OfficialFR_Audit.txt
          grep -F 'Unmatched location/destination names: 0' tools/TR_OfficialFR_Audit.txt
          grep -F 'Zone names extracted: 47 / matched: 47' tools/TR_OfficialFR_Audit.txt
          grep -F 'Area names extracted: 83 / matched: 83' tools/TR_OfficialFR_Audit.txt

      - name: Commit fixes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dusk/TravelRef/TR_Main.lua Dusk/TravelRef/TR_Window.lua Dusk/TravelRef/TR_Launcher.lua Dusk/TravelRef/TR_OfficialFR.lua Dusk/TravelRef/TR_OfficialFR_Auto.lua Dusk/TravelRef/TR_FR_NOTES.txt Dusk/TravelRef.plugin Dusk/TravelRef.plugincompendium tools/generate_official_fr.py tools/TR_OfficialFR_Audit.txt .github/workflows/generate-official-fr.yml
          git commit -m "Fix TravelRef FR audit findings"
          git push
