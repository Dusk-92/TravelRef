name: Apply r7 audit fixes

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/apply_r7_patch.py"
      - ".github/workflows/apply-r7-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Apply guarded patch
        run: python3 tools/apply_r7_patch.py

      - name: Validate Lua syntax
        run: |
          LUAC="$(command -v luac5.1 || command -v luac)"
          find Dusk/TravelRef -type f -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            "$LUAC" -p "$file"
          done

      - name: Validate plugin XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('Dusk/TravelRef.plugin')"

      - name: Check r7 fixes
        run: |
          grep -F 'TR_req.NV[args] = not TR_req.NV[args]' Dusk/TravelRef/TR_Main.lua
          grep -F 'if TR_req.NV[name] then markname=' Dusk/TravelRef/TR_Main.lua
          grep -F 'local dtime = tonumber(self.dtime:GetText())' Dusk/TravelRef/TR_Window.lua
          grep -F 'TD_list[tdCode] or 1' Dusk/TravelRef/TR_Window.lua
          grep -F 'table.sort(zlist, TR_FrenchSort)' Dusk/TravelRef/TR_Window.lua
          grep -F '<Version>3.3.2-FR-r7</Version>' Dusk/TravelRef.plugin

      - name: Commit fixes
        run: |
          if [ -z "$(git status --porcelain -- Dusk/TravelRef/TR_Main.lua Dusk/TravelRef/TR_Window.lua Dusk/TravelRef.plugin Dusk/TravelRef/TR_FR_NOTES.txt)" ]; then
            echo "No r7 changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dusk/TravelRef/TR_Main.lua Dusk/TravelRef/TR_Window.lua Dusk/TravelRef.plugin Dusk/TravelRef/TR_FR_NOTES.txt
          git commit -m "Fix TravelRef r7 audit findings"
          git push
