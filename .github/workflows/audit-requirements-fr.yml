name: Audit official French requirements

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/audit_requirements_fr.py"
      - ".github/workflows/audit-requirements-fr.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit requirements
        run: python3 tools/audit_requirements_fr.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/TR_RequirementsFR_Audit.txt
          git diff --cached --quiet && exit 0
          git commit -m "Audit official French TravelRef requirements"
          git pull --rebase origin main
          git push
