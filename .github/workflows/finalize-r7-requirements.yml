name: Finalize r7 requirements

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/finalize_r7_requirements.py"
      - ".github/workflows/finalize-r7-requirements.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded patch
        run: python3 tools/finalize_r7_requirements.py
      - name: Generate requirement localization
        run: python3 tools/generate_requirements_fr.py
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Validate generated Lua
        run: |
          LUAC="$(command -v luac5.1 || command -v luac)"
          "$LUAC" -p Dusk/TravelRef/TR_OfficialFR.lua
          "$LUAC" -p Dusk/TravelRef/TR_OfficialFR_Requirements.lua
      - name: Check expected coverage
        run: |
          grep -F 'Matched officially: 75' tools/TR_RequirementsFR_Audit.txt
          grep -F 'Unmatched: 2' tools/TR_RequirementsFR_Audit.txt
          grep -F 'Q7: V4;B9;Ch 2: The Eagles are Coming' tools/TR_RequirementsFR_Audit.txt
          grep -F 'Q8: BBM;Ch 11.2: The Same as You' tools/TR_RequirementsFR_Audit.txt
          grep -F 'TR_OfficialSafeImport("Dusk.TravelRef.TR_OfficialFR_Requirements", true)' Dusk/TravelRef/TR_OfficialFR.lua
      - name: Commit final r7 requirement localization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/generate_requirements_fr.py tools/TR_RequirementsFR_Audit.txt Dusk/TravelRef/TR_OfficialFR_Requirements.lua Dusk/TravelRef/TR_OfficialFR.lua Dusk/TravelRef/TR_FR_NOTES.txt
          git diff --cached --quiet && exit 0
          git commit -m "Finalize TravelRef r7 French requirements"
          git pull --rebase origin main
          git push
