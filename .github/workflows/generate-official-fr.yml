name: Generate official French mappings

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/generate_official_fr.py"
      - "Dusk/TravelRef/TR_Data.lua"
      - ".github/workflows/generate-official-fr.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate mappings
        run: python3 tools/generate_official_fr.py

      - name: Commit generated files
        run: |
          if [ -z "$(git status --porcelain -- Dusk/TravelRef/TR_OfficialFR_Auto.lua tools/TR_OfficialFR_Audit.txt)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dusk/TravelRef/TR_OfficialFR_Auto.lua tools/TR_OfficialFR_Audit.txt
          git commit -m "Generate official LOTRO French mappings"
          git push
