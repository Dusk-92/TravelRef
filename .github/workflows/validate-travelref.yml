name: Validate TravelRef

on:
  workflow_dispatch:
  push:
    paths:
      - "Dusk/TravelRef/**"
      - "Dusk/TravelRef.plugin"
      - "tools/generate_official_fr.py"
      - "tools/generate_requirements_fr.py"
      - "tools/TR_OfficialFR_Audit.txt"
      - "tools/TR_RequirementsFR_Audit.txt"
      - ".github/workflows/validate-travelref.yml"
  pull_request:
    paths:
      - "Dusk/TravelRef/**"
      - "Dusk/TravelRef.plugin"
      - "tools/generate_official_fr.py"
      - "tools/generate_requirements_fr.py"
      - "tools/TR_OfficialFR_Audit.txt"
      - "tools/TR_RequirementsFR_Audit.txt"
      - ".github/workflows/validate-travelref.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Validate Lua syntax
        run: |
          LUAC="$(command -v luac5.1 || command -v luac)"
          find Dusk/TravelRef -type f -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            "$LUAC" -p "$file"
          done

      - name: Validate generator syntax
        run: |
          python3 -m py_compile tools/generate_official_fr.py
          python3 -m py_compile tools/generate_requirements_fr.py

      - name: Validate plugin XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('Dusk/TravelRef.plugin')"

      - name: Check generated localization is current
        run: |
          python3 tools/generate_official_fr.py
          python3 tools/generate_requirements_fr.py
          git diff --exit-code -- Dusk/TravelRef/TR_OfficialFR_Auto.lua Dusk/TravelRef/TR_OfficialFR_Requirements.lua tools/TR_OfficialFR_Audit.txt tools/TR_RequirementsFR_Audit.txt

      - name: Check localization coverage reports
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path('tools/TR_OfficialFR_Audit.txt').read_text(encoding='utf-8')

          def number(pattern, source=text):
              match = re.search(pattern, source)
              if not match:
                  raise SystemExit(f'Missing audit metric: {pattern}')
              return tuple(int(value) for value in match.groups())

          locations, = number(r'Real TravelRef location/destination names extracted: (\d+)')
          matched_locations, = number(r'Matched location/destination names: (\d+)')
          unmatched_locations, = number(r'Unmatched location/destination names: (\d+)')
          zones, matched_zones = number(r'Zone names extracted: (\d+) / matched: (\d+)')
          areas, matched_areas = number(r'Area names extracted: (\d+) / matched: (\d+)')

          assert locations == matched_locations, (locations, matched_locations)
          assert unmatched_locations == 0, unmatched_locations
          assert zones == matched_zones, (zones, matched_zones)
          assert areas == matched_areas, (areas, matched_areas)

          req = Path('tools/TR_RequirementsFR_Audit.txt').read_text(encoding='utf-8')
          total, = number(r'Requirements extracted: (\d+)', req)
          matched, = number(r'Matched/verified French: (\d+)', req)
          current, = number(r'Current official-data matches: (\d+)', req)
          historical, = number(r'Verified historical overrides: (\d+)', req)
          fuzzy, = number(r'Fuzzy faction matches: (\d+)', req)
          unmatched, = number(r'Unmatched: (\d+)', req)

          assert matched == total, (matched, total)
          assert current + historical == total, (current, historical, total)
          assert unmatched == 0, unmatched
          assert fuzzy == 0, fuzzy
          unmatched_section = req.split('UNMATCHED:', 1)[1] if 'UNMATCHED:' in req else ''
          assert not re.search(r'^- \w+:', unmatched_section, re.M)
          print(f'Coverage OK: {locations} locations, {zones} zones, {areas} areas, {matched}/{total} requirements ({historical} historical overrides)')
          PY

      - name: Check known regressions
        run: |
          grep -F '<Package>Dusk.TravelRef.TR_Entry</Package>' Dusk/TravelRef.plugin
          grep -F '<Version>3.3.2-FR-r8</Version>' Dusk/TravelRef.plugin
          grep -F 'import "Dusk.TravelRef.TR_Main"' Dusk/TravelRef/TR_Entry.lua
          grep -F 'import "Dusk.TravelRef.TR_Robustness"' Dusk/TravelRef/TR_Entry.lua
          grep -F 'elseif (flg or tbl.d) and (not r or tbl.r == r) then' Dusk/TravelRef/TR_Robustness.lua
          grep -F 'local function TR_SearchNorm' Dusk/TravelRef/TR_Main.lua
          grep -F 'function TR_FrenchSort(a,b)' Dusk/TravelRef/TR_Main.lua
          grep -F 'TR_req.NV[args] = not TR_req.NV[args]' Dusk/TravelRef/TR_Main.lua
          grep -F 'for name,nv in pairs(TR_req.NV) do' Dusk/TravelRef/TR_Main.lua
          grep -F 'if TR_req.NV[name] then markname=' Dusk/TravelRef/TR_Main.lua
          test "$(grep -F -c 'if TR_req.NV[name] then str=' Dusk/TravelRef/TR_Main.lua)" -eq 2
          ! grep -F 'if TR_req[name] then str=' Dusk/TravelRef/TR_Main.lua
          grep -F 'table.sort(Loc_list, function(a,b) return TR_FrenchSort(TR_LocName(a),TR_LocName(b)) end)' Dusk/TravelRef/TR_Main.lua
          grep -F 'table.sort(dest, function(a,b) return TR_FrenchSort(TR_LocName(a),TR_LocName(b)) end)' Dusk/TravelRef/TR_Main.lua
          ! grep -F 'table.sort(Loc_list)' Dusk/TravelRef/TR_Main.lua
          ! grep -F 'table.sort(dest)' Dusk/TravelRef/TR_Main.lua
          grep -F 'local d,ln = Loc_Find(nil, y, x, Locs)' Dusk/TravelRef/TR_Main.lua
          grep -F 'local dest = { }' Dusk/TravelRef/TR_Main.lua
          grep -F 'local z = Areas[areaArg]' Dusk/TravelRef/TR_Main.lua
          grep -F 'local pname = player:GetName()' Dusk/TravelRef/TR_Main.lua
          grep -F 'local dt = { [MRD] = R_Dest[MRD] }' Dusk/TravelRef/TR_Window.lua
          grep -F 'local w = Turbine.UI.Lotro.Shortcut' Dusk/TravelRef/TR_Window.lua
          grep -F 'TD_list[tdCode] or 1' Dusk/TravelRef/TR_Window.lua
          grep -F 'if tdCode=="R17" and TR_req.R18 then td = td-0.1 end' Dusk/TravelRef/TR_Window.lua
          grep -F 'if TR_req.S2 then td = td*0.8 end' Dusk/TravelRef/TR_Window.lua
          grep -F 'local dtime = tonumber(self.dtime:GetText())' Dusk/TravelRef/TR_Window.lua
          grep -F 'TR_req.dtime or 20' Dusk/TravelRef/TR_Window.lua
          grep -F 'self.visit:SetChecked(TR_req.NV[dest] or false)' Dusk/TravelRef/TR_Window.lua
          grep -F 'table.sort(zlist, TR_FrenchSort)' Dusk/TravelRef/TR_Window.lua
          grep -F 'table.sort(Loc_list, TR_FrenchSort)' Dusk/TravelRef/TR_Window.lua
          grep -F 'table.sort(list, TR_FrenchSort)' Dusk/TravelRef/TR_Window.lua
          grep -F 'Lieu de route introuvable' Dusk/TravelRef/TR_Window.lua
          ! grep -F 'Nul loc' Dusk/TravelRef/TR_Window.lua
          grep -F 'TR_OfficialSafeImport("Dusk.TravelRef.TR_OfficialFR_Auto", true)' Dusk/TravelRef/TR_OfficialFR.lua
          grep -F 'TR_OfficialSafeImport("Dusk.TravelRef.TR_OfficialFR_Requirements", true)' Dusk/TravelRef/TR_OfficialFR.lua
          grep -F 'for _,en in ipairs(zones) do applyZone(en) end' Dusk/TravelRef/TR_OfficialFR.lua
          grep -F 'local ambiguousLoc = {}' Dusk/TravelRef/TR_OfficialFR.lua
          grep -F 'local ambiguousZone = {}' Dusk/TravelRef/TR_OfficialFR.lua
          grep -F 'local ambiguousArea = {}' Dusk/TravelRef/TR_OfficialFR.lua
          grep -F '["œ"]="oe"' Dusk/TravelRef/Common/noAccent.lua
          grep -F '"Men of Entwash Vale": "Men of the Entwash Vale"' tools/generate_requirements_fr.py
          ! grep -F 'loc.a = TR_AreaFR' Dusk/TravelRef/TR_OfficialFR.lua
          ! grep -F 'Areas = NewAreas' Dusk/TravelRef/TR_OfficialFR.lua
          ! grep -F 'print(loc.n.." @ "..loc.l)' Dusk/TravelRef/TR_Main.lua
          ! grep -F '[fp]' Dusk/TravelRef/TR_OfficialFR_Auto.lua
